name: Verifiche app
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifica sintassi e sillabo
        run: npm run check
